name: ios-essai

# Lancement à la main seulement (onglet Actions > ios-essai > Run workflow).
on:
  workflow_dispatch:

jobs:
  build:
    # Xcode 27 (runner arm64 de GitHub, étiquette « xcode-27 ») : nécessaire pour la segmentation au toucher de Vision (iPadOS 27).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Cache des dépendances Rust (gagne plusieurs minutes quand Cargo.lock ne change pas).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Moteur Rust : tests, puis bibliothèque pour l'iPad (étape 1).
      # Tests en mode normal (non optimisé) : bien plus rapide à compiler que « --release ».
      - name: Tests du moteur Rust (pont + moteur sursaut-core copié du PC)
        working-directory: engine
        run: cargo test --workspace

      - name: Compiler le moteur Rust pour l'iPad
        working-directory: engine
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libsursaut_engine.a ../packages/pencil_bridge/ios/libsursaut_engine.a
          ls -lh ../packages/pencil_bridge/ios/libsursaut_engine.a

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions utilisées (à noter dans le cahier, test 0.1)
        run: |
          flutter --version
          xcodebuild -version

      # Le dossier ios/ n'est pas dans le dépôt : on le fabrique, puis on
      # remet nos propres fichiers au cas où « flutter create » les aurait touchés.
      - name: Fabriquer le dossier ios
        run: |
          mkdir -p /tmp/sauvegarde
          cp -R lib test pubspec.yaml analysis_options.yaml /tmp/sauvegarde/
          flutter create . --platforms=ios --project-name sursaut_essai --org com.davidcapraro
          rm -rf lib test pubspec.yaml analysis_options.yaml
          cp -R /tmp/sauvegarde/lib /tmp/sauvegarde/test ./
          cp /tmp/sauvegarde/pubspec.yaml /tmp/sauvegarde/analysis_options.yaml ./

      # TensorFlow Lite (parties du corps : cheveux, vêtements, peau) est une bibliothèque statique alors que l'application
      # est en bibliothèques dynamiques : CocoaPods refuse ce mélange par défaut ; on désactive ce contrôle (la bibliothèque
      # est alors liée dans le plugin pencil_bridge, et retirée de la liaison de Runner pour n'exister qu'une fois).
      - name: TensorFlow Lite (contrôle CocoaPods des bibliothèques statiques)
        run: |
          printf '%s\n' '' 'pre_install do |installer|' '  Pod::Installer::Xcode::TargetValidator.send(:define_method, :verify_no_static_framework_transitive_dependencies) {}' 'end' >> ios/Podfile
          cat tools/podfile_tflite.rb >> ios/Podfile
          tail -20 ios/Podfile

      # SAM 2.1 (sélection au toucher) : les trois modèles Core ML d'Apple (Apache 2.0, 94 Mo, apple/coreml-sam2.1-small sur Hugging Face)
      # sont téléchargés, compilés (.mlpackage -> .mlmodelc) et mis dans le plugin avant « pod install ».
      - name: SAM 2.1 (modèles Core ML)
        run: |
          python3 -m venv sam_venv
          sam_venv/bin/pip install --quiet huggingface_hub
          sam_venv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('apple/coreml-sam2.1-small', local_dir='sam_src', allow_patterns=['*.mlpackage/**'])"
          find sam_src -maxdepth 2 | sort
          mkdir -p packages/pencil_bridge/ios/Assets
          for m in SAM2_1SmallImageEncoderFLOAT16 SAM2_1SmallPromptEncoderFLOAT16 SAM2_1SmallMaskDecoderFLOAT16; do
            xcrun coremlcompiler compile "sam_src/$m.mlpackage" packages/pencil_bridge/ios/Assets
          done
          ls -la packages/pencil_bridge/ios/Assets

      # LaMa (suppression par IA) : modèle Core ML (Apache 2.0, 40 Mo, Dadm-n/lama-dilated-coreml sur Hugging Face). Les deux gros fichiers sont
      # téléchargés avec leur empreinte SHA-256 vérifiée, le petit fichier de description est écrit ici, puis le paquet est compilé et mis
      # dans l'application (plus de téléchargement sur l'iPad).
      - name: LaMa (modèle Core ML)
        run: |
          B=https://huggingface.co/Dadm-n/lama-dilated-coreml/resolve/main/Resources/LaMa.mlpackage
          mkdir -p lama_src/LaMa.mlpackage/Data/com.apple.CoreML/weights
          curl -L --fail --retry 3 -o lama_src/LaMa.mlpackage/Data/com.apple.CoreML/model.mlmodel "$B/Data/com.apple.CoreML/model.mlmodel"
          curl -L --fail --retry 3 -o lama_src/LaMa.mlpackage/Data/com.apple.CoreML/weights/weight.bin "$B/Data/com.apple.CoreML/weights/weight.bin"
          echo "f39493f520a05444c3112c491249d855626d0b296b404f0b1a3a49641f527bd3  lama_src/LaMa.mlpackage/Data/com.apple.CoreML/model.mlmodel" | shasum -a 256 -c -
          echo "2b2226b91788047b75794bd990c6eac7200853389d636692799764f40fb93bbd  lama_src/LaMa.mlpackage/Data/com.apple.CoreML/weights/weight.bin" | shasum -a 256 -c -
          cat > lama_src/LaMa.mlpackage/Manifest.json <<'JSON'
          {
            "fileFormatVersion": "1.0.0",
            "itemInfoEntries": {
              "78103851-967E-4083-B0A0-6C421CC29DD7": {
                "author": "com.apple.CoreML",
                "description": "CoreML Model Weights",
                "name": "weights",
                "path": "com.apple.CoreML/weights"
              },
              "8888288F-5BA8-4BAD-BCC7-E8A2378CBE5F": {
                "author": "com.apple.CoreML",
                "description": "CoreML Model Specification",
                "name": "model.mlmodel",
                "path": "com.apple.CoreML/model.mlmodel"
              }
            },
            "rootModelIdentifier": "8888288F-5BA8-4BAD-BCC7-E8A2378CBE5F"
          }
          JSON
          mkdir -p packages/pencil_bridge/ios/Assets
          xcrun coremlcompiler compile lama_src/LaMa.mlpackage packages/pencil_bridge/ios/Assets
          ls -la packages/pencil_bridge/ios/Assets

      # Logo de Sursaut : on remplace l'icône Flutter par assets/app_icon_1024.png (carré, sans transparence,
      # comme l'exige iOS) en fabriquant toutes les tailles listées par le modèle Flutter.
      - name: Icône de l'application
        run: |
          python3 - <<'PY'
          import json, subprocess
          d = "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          contents = json.load(open(d + "/Contents.json"))
          done = set()
          for img in contents["images"]:
              name = img.get("filename")
              if not name or name in done:
                  continue
              w = float(img["size"].split("x")[0])
              px = int(round(w * float(img["scale"].replace("x", ""))))
              subprocess.run(["sips", "-z", str(px), str(px), "assets/app_icon_1024.png", "--out", d + "/" + name], check=True, stdout=subprocess.DEVNULL)
              done.add(name)
          print("icônes fabriquées :", len(done))
          PY

      # Descriptions d'autorisations demandées par iPadOS (appareil photo branché).
      - name: Autorisations (Info.plist)
        run: |
          plutil -insert NSCameraUsageDescription -string "Sursaut lit l'appareil photo branché en USB-C." ios/Runner/Info.plist
          plutil -insert NSPhotoLibraryUsageDescription -string "Sursaut lit les photos importées de l'appareil." ios/Runner/Info.plist
          plutil -insert NSPhotoLibraryAddUsageDescription -string "Sursaut enregistre les photos développées." ios/Runner/Info.plist
          plutil -insert UIFileSharingEnabled -bool true ios/Runner/Info.plist
          plutil -insert LSSupportsOpeningDocumentsInPlace -bool true ios/Runner/Info.plist

      # Garder les noms des fonctions du moteur Rust dans l'exécutable (dart:ffi les cherche par nom).
      - name: Conserver les symboles du moteur
        run: |
          echo "STRIP_STYLE = non-global" >> ios/Flutter/Release.xcconfig
          cat ios/Flutter/Release.xcconfig

      - run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Un test d'écran qui échoue ne doit pas empêcher d'obtenir l'application : on le signale sans bloquer.
      - name: Tests Flutter (ne bloque pas)
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Compiler sans signature
        run: flutter build ios --release --no-codesign

      - name: Vérifier que le moteur Rust est dans l'application (information, ne bloque pas)
        continue-on-error: true
        run: |
          find build/ios/iphoneos/Runner.app -type f \( -name Runner -o -name pencil_bridge \) | while read f; do
            echo "== $f"; nm -gU "$f" | grep sursaut_ || echo "(aucun symbole sursaut_ dans ce fichier)"
          done

      - name: Fabriquer l'ipa non signé
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr SursautEssai-non-signe.ipa Payload
          ls -lh SursautEssai-non-signe.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SursautEssai-ipa
          path: SursautEssai-non-signe.ipa
          retention-days: 7
