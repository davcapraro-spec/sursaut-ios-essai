name: sursaut_essai
description: "Sursaut iPad : application d'essai de l'étape 0 (chaîne de compilation et d'installation)."
publish_to: "none"
version: 0.14.0+36

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  image: ^4.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  pencil_bridge:
    path: packages/pencil_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_sursaut.png
    - assets/lens_profiles.json
