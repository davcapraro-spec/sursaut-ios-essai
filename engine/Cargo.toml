[package]
name = "sursaut_engine"
version = "0.4.1"
edition = "2021"
description = "Pont C du moteur Sursaut pour l'iPad (appelé par Flutter via dart:ffi)"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["sursaut-core"]

[lib]
name = "sursaut_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sursaut-core = { path = "sursaut-core" }
sursaut-libraw-sys = { path = "vendor/libraw-sys" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
