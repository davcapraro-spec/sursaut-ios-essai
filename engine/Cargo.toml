[package]
name = "sursaut_engine"
version = "0.1.0"
edition = "2021"
description = "Moteur de rendu de Sursaut iPad (étape 1 : chaîne Flutter -> Rust)"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "sursaut_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
