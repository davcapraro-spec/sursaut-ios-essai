[package]
name = "sursaut-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Moteur de développement non destructif de Sursaut by David (PC, Android, iOS)"

[lib]
name = "sursaut_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

